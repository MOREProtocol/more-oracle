[package]
name = "vault-oracle-keeper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "keeper"
path = "src/main.rs"

[dependencies]
alloy = { version = "0.9", default-features = false, features = [
    "std",
    "serde",
    "consensus",
    "contract",
    "eips",
    "k256",
    "network",
    "provider-http",
    "reqwest-rustls-tls",
    "rpc-types",
    "signer-local",
    "sol-types",
] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.7"
